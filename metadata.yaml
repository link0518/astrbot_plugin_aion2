name: astrbot_plugin_aion2
display_name: AION2 永恒之塔2 查询
short_desc: 查询 AION2 的角色、装备、道具与官方公告，中文输出
desc: >
  基于 NC 官网数据接口查询 AION2 的信息，默认查日服，可切美东、美西、欧服、南美服。
  支持角色档案、装备面板、守护者板进度、道具详情、服务器与职业列表、官方公告。
  界面与输出均为简体中文：职业、属性、部位、品级等术语用词表翻译，
  职业按 pcId 解码，道具与装备名按 ID 从台服反查中文。
  角色、装备、道具、公告等指令带不带斜杠都能触发。
  另外内置活动时刻表（时空裂隙、小游戏），可订阅开场前的提醒。
  插件在 WebUI 里自带控制台页面：改配置、看运行状态、管理提醒订阅、预览时刻表。
version: v0.1.2
author: WorkBuddy
repo: "https://github.com/link0518/astrbot_plugin_aion2"
# 查询功能自 4.5.1 起即可用；控制台页面依赖 Plugin Pages（4.24.1 引入），
# 更低版本上插件仍能加载与查询，只是没有这个页面
astrbot_version: ">=4.5.1"
